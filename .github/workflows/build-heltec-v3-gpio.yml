name: Build Heltec V3 GPIO V4 Final Firmware

on:
  push:
    branches:
      - meshcore-1.16-heltec-gpio-v4-final
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Apply final Heltec GPIO V4 patch
        run: python3 tools/patch_heltec_gpio_v4_final.py

      - name: Build Heltec V3 BLE firmware
        run: pio run -e Heltec_v3_companion_radio_ble

      - name: Build Heltec V3 USB firmware
        run: pio run -e Heltec_v3_companion_radio_usb

      - name: Collect firmware
        run: |
          mkdir -p out
          cp .pio/build/Heltec_v3_companion_radio_ble/firmware.bin out/MeshCore-1.16.0-HeltecV3-GPIO-V4-FINAL-BLE.bin
          cp .pio/build/Heltec_v3_companion_radio_usb/firmware.bin out/MeshCore-1.16.0-HeltecV3-GPIO-V4-FINAL-USB.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MeshCore-1.16.0-HeltecV3-GPIO-V4-FINAL
          path: out/*.bin
