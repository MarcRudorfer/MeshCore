name: Build Heltec V3 GPIO26 Test Firmware

on:
  push:
    branches:
      - meshcore-1.16-heltec-gpio26-test
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Apply isolated GPIO26 test patch
        run: python3 tools/patch_heltec_gpio26_test.py

      - name: Build Heltec V3 BLE firmware
        run: pio run -e Heltec_v3_companion_radio_ble

      - name: Build Heltec V3 USB firmware
        run: pio run -e Heltec_v3_companion_radio_usb

      - name: Collect firmware
        run: |
          mkdir -p out
          cp .pio/build/Heltec_v3_companion_radio_ble/firmware.bin out/MeshCore-1.16.0-HeltecV3-GPIO26-TEST-BLE.bin
          cp .pio/build/Heltec_v3_companion_radio_usb/firmware.bin out/MeshCore-1.16.0-HeltecV3-GPIO26-TEST-USB.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MeshCore-1.16.0-HeltecV3-GPIO26-TEST
          path: out/*.bin
