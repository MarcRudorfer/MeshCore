name: Build Heltec V4 V5 Diagnostic 1

on:
  push:
    branches:
      - meshcore-1.16-heltec-v4-v5-diagnostic
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Apply tested GPIO logic
        run: python3 tools/patch_heltec_gpio_v4_final.py

      - name: Add Heltec V4 GPIO mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('variants/heltec_v4/platformio.ini')
          s = p.read_text()
          flags = (
              '  -D REMOTE_GPIO_OUT1=4\n'
              '  -D REMOTE_GPIO_OUT2=26\n'
              '  -D REMOTE_GPIO_OUT3=47\n'
              '  -D REMOTE_GPIO_OUT4=48\n'
              '  -D REMOTE_GPIO_IN1=3\n'
              '  -D REMOTE_GPIO_IN2=6\n'
              '  -D REMOTE_GPIO_IN3=33\n'
              '  -D REMOTE_GPIO_IN4=15\n'
          )
          base_flags = '$' + '{heltec_v4_oled.build_flags}'
          for env in ('heltec_v4_companion_radio_usb', 'heltec_v4_companion_radio_ble'):
              anchor = f'[env:{env}]\nextends = heltec_v4_oled\nbuild_flags =\n  {base_flags}\n'
              if anchor not in s:
                  raise SystemExit(f'{env} anchor not found')
              s = s.replace(anchor, anchor + flags, 1)
          p.write_text(s)
          PY

      - name: Diagnostic step 1 - peer state only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('examples/companion_radio/MyMesh.cpp')
          s = p.read_text()
          anchor = 'static bool gpio_notify_contact_valid = false;\n'
          extra = anchor + '\nstatic ContactInfo gpio_link_peer;\nstatic bool gpio_link_peer_valid = false;\n'
          if anchor not in s:
              raise SystemExit('peer-state anchor not found')
          p.write_text(s.replace(anchor, extra, 1))
          PY

      - name: Build Heltec V4 BLE firmware
        run: pio run -e heltec_v4_companion_radio_ble

      - name: Collect firmware
        run: |
          mkdir -p out
          cp .pio/build/heltec_v4_companion_radio_ble/firmware.bin out/MeshCore-1.16.0-HeltecV4-V5-DIAG1-BLE.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: MeshCore-1.16.0-HeltecV4-V5-DIAG1
          path: out/*.bin
