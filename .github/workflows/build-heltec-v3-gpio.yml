name: Build Heltec V4 V5 Diagnostic 4S NO UI NEWMSG

on:
  push:
    branches:
      - meshcore-1.16-heltec-v4-v5-diagnostic
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Apply tested GPIO logic
        run: python3 tools/patch_heltec_gpio_v4_final.py

      - name: Add Heltec V4 GPIO mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('variants/heltec_v4/platformio.ini')
          s = p.read_text()
          flags = (
              '  -D REMOTE_GPIO_OUT1=4\n'
              '  -D REMOTE_GPIO_OUT2=26\n'
              '  -D REMOTE_GPIO_OUT3=47\n'
              '  -D REMOTE_GPIO_IN1=3\n'
              '  -D REMOTE_GPIO_IN2=6\n'
              '  -D REMOTE_GPIO_IN3=33\n'
              '  -D REMOTE_GPIO_IN4=15\n'
          )
          base_flags = '$' + '{heltec_v4_oled.build_flags}'
          for env in ('heltec_v4_companion_radio_usb', 'heltec_v4_companion_radio_ble'):
              anchor = f'[env:{env}]\nextends = heltec_v4_oled\nbuild_flags =\n  {base_flags}\n'
              if anchor not in s:
                  raise SystemExit(f'{env} anchor not found')
              s = s.replace(anchor, anchor + flags, 1)
          p.write_text(s)
          PY

      - name: Apply isolated OUT4 runtime path with timer state only
        run: python3 tools/patch_heltec_v4_v5_diag3.py

      - name: Apply DIAG4N two-branch OUT4 test
        run: python3 tools/diag4j_move_onoff.py

      - name: Add OLED boot-stage diagnostics
        run: python3 tools/diag4o_oled_boot_markers.py

      - name: Skip sensor initialization
        run: python3 tools/diag4p_skip_sensors.py

      - name: Add post-sensor boot markers
        run: python3 tools/diag4q_post_sensor_markers.py

      - name: Skip sensor loop
        run: python3 tools/diag4r_skip_sensor_loop.py

      - name: Skip UI newMsg on incoming contact messages
        run: python3 tools/diag4s_skip_ui_newmsg.py

      - name: Build Heltec V4 BLE firmware
        run: pio run -e heltec_v4_companion_radio_ble

      - name: Collect firmware
        run: |
          mkdir -p out
          cp .pio/build/heltec_v4_companion_radio_ble/firmware.bin out/MeshCore-1.16.0-HeltecV4-V5-DIAG4S-NO-UI-NEWMSG.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: MeshCore-1.16.0-HeltecV4-V5-DIAG4S-NO-UI-NEWMSG
          path: out/*.bin
